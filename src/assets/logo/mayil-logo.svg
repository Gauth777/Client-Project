<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Sri Kannika Parameswari rice mill logo</title>
  <desc id="logoDesc">Blue and gold circular emblem with peacock-inspired Mayil lettering.</desc>
  <defs>
    <radialGradient id="blueFace" cx="42%" cy="30%" r="78%">
      <stop offset="0" stop-color="#0f64bf"/>
      <stop offset="0.48" stop-color="#084aa3"/>
      <stop offset="1" stop-color="#062874"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a5"/>
      <stop offset="0.22" stop-color="#efc443"/>
      <stop offset="0.55" stop-color="#b87508"/>
      <stop offset="0.78" stop-color="#f2cc55"/>
      <stop offset="1" stop-color="#8d5706"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe68b"/>
      <stop offset="1" stop-color="#bd7908"/>
    </linearGradient>
    <linearGradient id="featherGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7dd28"/>
      <stop offset="0.48" stop-color="#39a638"/>
      <stop offset="1" stop-color="#096c4d"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#001337" flood-opacity="0.38"/>
    </filter>
    <path id="topArc" d="M 66 111 A 106 106 0 0 1 254 111"/>
    <path id="bottomArc" d="M 48 214 A 125 125 0 0 0 272 214"/>
  </defs>

  <circle cx="160" cy="160" r="157" fill="url(#goldRing)"/>
  <circle cx="160" cy="160" r="149" fill="#f9d76a" stroke="#8f5706" stroke-width="2"/>
  <circle cx="160" cy="160" r="137" fill="#073a91" stroke="#e7b72e" stroke-width="4"/>
  <circle cx="160" cy="160" r="130" fill="url(#blueFace)" stroke="#03235f" stroke-width="3"/>
  <circle cx="160" cy="160" r="124" fill="none" stroke="#2b80d3" stroke-width="2" opacity="0.65"/>

  <g fill="#a56708">
    <circle cx="138" cy="18" r="3.2"/>
    <circle cx="160" cy="14" r="3.2"/>
    <circle cx="182" cy="18" r="3.2"/>
  </g>

  <text fill="#fff6cf" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SRI KANNIKA PARAMESWARI</textPath>
  </text>

  <g filter="url(#softShadow)">
    <text x="29" y="187" fill="#fffdf4" stroke="#041b58" stroke-width="2.5" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="-8">Ma</text>
    <text x="173" y="188" fill="#fffdf4" stroke="#041b58" stroke-width="2.5" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" font-style="italic" letter-spacing="-8">il</text>

    <path d="M161 181c20-30 28-53 24-70-2-11-9-18-20-21-11-2-20 2-27 13 9-5 16-5 23-1 9 5 11 15 5 28-6 14-16 30-31 49z" fill="#fffdf4" stroke="#041b58" stroke-width="2.5"/>
    <circle cx="174" cy="91" r="4" fill="#062974"/>
    <path d="M164 82l-7-11m12 9l0-15m6 17l8-11" stroke="#ffe676" stroke-width="4" stroke-linecap="round"/>
    <path d="M156 104c-12-5-24-4-34 2 12 1 21 5 29 12" fill="none" stroke="#e7b72e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="160" y="215" text-anchor="middle" fill="#fffdf4" stroke="#05215e" stroke-width="1.2" paint-order="stroke" font-family="Noto Sans Tamil, Latha, sans-serif" font-size="25" font-weight="700">மயில்</text>

  <g transform="translate(194 171) rotate(-5)" filter="url(#softShadow)">
    <g transform="translate(0 0) rotate(-25)">
      <path d="M0 0C23-14 51-15 73-3 54 17 31 24 3 20Z" fill="url(#featherGreen)" stroke="#073b80" stroke-width="2"/>
      <ellipse cx="47" cy="3" rx="10" ry="7" fill="#0b4da8"/><ellipse cx="47" cy="3" rx="5" ry="4" fill="#e5cc32"/>
    </g>
    <g transform="translate(8 17) rotate(-12)">
      <path d="M0 0C23-14 51-15 73-3 54 17 31 24 3 20Z" fill="url(#featherGreen)" stroke="#073b80" stroke-width="2"/>
      <ellipse cx="47" cy="3" rx="10" ry="7" fill="#0b4da8"/><ellipse cx="47" cy="3" rx="5" ry="4" fill="#e5cc32"/>
    </g>
    <g transform="translate(12 37) rotate(1)">
      <path d="M0 0C23-14 51-15 73-3 54 17 31 24 3 20Z" fill="url(#featherGreen)" stroke="#073b80" stroke-width="2"/>
      <ellipse cx="47" cy="3" rx="10" ry="7" fill="#0b4da8"/><ellipse cx="47" cy="3" rx="5" ry="4" fill="#e5cc32"/>
    </g>
    <g transform="translate(3 56) rotate(15)">
      <path d="M0 0C21-13 47-14 67-2 50 16 28 22 3 18Z" fill="url(#featherGreen)" stroke="#073b80" stroke-width="2"/>
      <ellipse cx="43" cy="3" rx="9" ry="6.5" fill="#0b4da8"/><ellipse cx="43" cy="3" rx="4.5" ry="3.5" fill="#e5cc32"/>
    </g>
    <g transform="translate(-11 24) rotate(-2)">
      <path d="M0 0C18-11 39-11 56-2 42 13 24 18 3 15Z" fill="url(#featherGreen)" stroke="#073b80" stroke-width="2"/>
      <ellipse cx="36" cy="2" rx="8" ry="5.5" fill="#0b4da8"/><ellipse cx="36" cy="2" rx="4" ry="3" fill="#e5cc32"/>
    </g>
    <g transform="translate(-10 45) rotate(13)">
      <path d="M0 0C18-11 39-11 56-2 42 13 24 18 3 15Z" fill="url(#featherGreen)" stroke="#073b80" stroke-width="2"/>
      <ellipse cx="36" cy="2" rx="8" ry="5.5" fill="#0b4da8"/><ellipse cx="36" cy="2" rx="4" ry="3" fill="#e5cc32"/>
    </g>
  </g>

  <text fill="#704304" font-family="Arial, sans-serif" font-size="10.4" font-weight="700" letter-spacing="1.25">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PURITY LIKE BEAUTY OF MAYIL</textPath>
  </text>
</svg>